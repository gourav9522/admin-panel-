<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSports RDX - Admin Panel</title>
    <style>
        body { background: #0b0e14; color: #fff; font-family: Arial, sans-serif; padding: 15px; margin: 0; }
        .box { background: #161b22; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #30363d; }
        input, button, select { width: 100%; padding: 10px; margin: 6px 0; border-radius: 5px; border: 1px solid #30363d; background: #0d1117; color: #fff; box-sizing: border-box; }
        .btn { background: #d29922; color: #000; font-weight: bold; cursor: pointer; }
        .btn-green { background: #2ea44f; color: #fff; }
        .btn-red { background: #da3633; color: #fff; }
        .user-card { background: #21262d; padding: 10px; margin-top: 8px; border-radius: 5px; border: 1px solid #30363d; }
    </style>
</head>
<body>

    <div id="loginBox" class="box">
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Password (9522)">
        <button class="btn" onclick="checkAdmin()">Login</button>
    </div>

    <div id="adminPanel" class="box" style="display:none;">
        <h2>Admin Dashboard</h2>

        <!-- Banner Setup -->
        <div class="box">
            <h3>Change Banner Link</h3>
            <input type="text" id="bannerUrlInput" placeholder="Enter Banner Image URL">
            <button class="btn btn-green" onclick="updateBanner()">Update Banner</button>
        </div>

        <!-- Create Match -->
        <div class="box">
            <h3>Create Match</h3>
            <input type="text" id="mTitle" placeholder="Match Title">
            <input type="text" id="mId" placeholder="Match ID">
            <input type="number" id="mFee" placeholder="Entry Fee">
            <input type="number" id="mPrize" placeholder="Win Prize">
            <input type="text" id="mWinRate" placeholder="Win Rate (e.g. 75%)">
            <input type="text" id="mTime" placeholder="Match Time">
            <input type="text" id="mPhoto" placeholder="Match Photo Link">
            <input type="text" id="mRoom" placeholder="Room ID & Password">
            <button class="btn btn-green" onclick="createMatch()">Publish Match</button>
        </div>

        <!-- Manage Matches -->
        <div class="box">
            <h3>Active Matches Control</h3>
            <div id="adminMatchesList">Loading matches...</div>
        </div>

        <!-- ALL USERS MANAGEMENT -->
        <div class="box">
            <h3>Registered Users & Coin Management</h3>
            <div id="allUsersList">Loading users...</div>
        </div>

        <!-- Manage Withdrawals -->
        <div class="box">
            <h3>Withdrawal & Deposit Requests</h3>
            <div id="requestsList">Loading requests...</div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBmBn7wouhYeKsLzZMoy21velN6XYT4JNo",
            authDomain: "ad-g-55646.firebaseapp.com",
            databaseURL: "https://ad-g-55646-default-rtdb.firebaseio.com",
            projectId: "ad-g-55646",
            storageBucket: "ad-g-55646.firebasestorage.app",
            messagingSenderId: "519103871395",
            appId: "1:519103871395:web:21b967c0dc5e646d9d8216",
            measurementId: "G-L4R8KEVLGY"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        function checkAdmin() {
            let pass = document.getElementById('adminPass').value;
            if(pass === "9522") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                loadAdminData();
            } else {
                alert("Wrong Password!");
            }
        }

        function updateBanner() {
            let url = document.getElementById('bannerUrlInput').value;
            db.collection("settings").doc("config").set({ bannerUrl: url }, { merge: true }).then(() => {
                alert("Banner Updated!");
            });
        }

        function createMatch() {
            db.collection("matches").add({
                title: document.getElementById('mTitle').value,
                matchId: document.getElementById('mId').value,
                entryFee: Number(document.getElementById('mFee').value),
                prize: Number(document.getElementById('mPrize').value),
                winRate: document.getElementById('mWinRate').value,
                time: document.getElementById('mTime').value,
                photoUrl: document.getElementById('mPhoto').value,
                roomDetails: document.getElementById('mRoom').value,
                status: "active"
            }).then(() => {
                alert("Match Created Successfully!");
            });
        }

        function loadAdminData() {
            // 1. Matches List
            db.collection("matches").onSnapshot(snapshot => {
                let html = "";
                snapshot.forEach(doc => {
                    let m = doc.data();
                    html += `
                        <p><b>${m.title}</b> (ID: ${m.matchId}) | Status: ${m.status}</p>
                        <button class="btn btn-green" onclick="markComplete('${doc.id}')">Mark Complete</button>
                        <button class="btn btn-red" onclick="deleteMatch('${doc.id}')">Delete Match</button>
                        <hr style="border-color:#30363d">
                    `;
                });
                document.getElementById('adminMatchesList').innerHTML = html;
            });

            // 2. All Users List
            db.collection("users").onSnapshot(snapshot => {
                let html = "";
                snapshot.forEach(doc => {
                    let u = doc.data();
                    let uid = doc.id;
                    html += `
                        <div class="user-card">
                            <p><b>Name:</b> ${u.name || 'N/A'}</p>
                            <p><b>Email:</b> ${u.email}</p>
                            <p><b>Coins/Wallet:</b> ₹<span id="wallet-${uid}">${u.wallet || 0}</span></p>
                            <input type="number" id="add-amt-${uid}" placeholder="Enter coins to add" style="margin:4px 0;">
                            <button class="btn btn-green" onclick="updateUserCoins('${uid}')">Add Coins</button>
                        </div>
                    `;
                });
                document.getElementById('allUsersList').innerHTML = html || "No users found.";
            });

            // 3. Withdrawals List
            db.collection("withdrawals").onSnapshot(snapshot => {
                let html = "";
                snapshot.forEach(doc => {
                    let w = doc.data();
                    html += `
                        <p>Withdrawal | UPI: <b>${w.upi}</b> | Amt: ₹${w.amount} | Status: ${w.status}</p>
                        <button class="btn btn-green" onclick="markWithdrawalSuccess('${doc.id}')">Mark Successful & Pay</button>
                        <hr style="border-color:#30363d">
                    `;
                });
                document.getElementById('requestsList').innerHTML = html;
            });
        }

        function markComplete(id) {
            db.collection("matches").doc(id).update({ status: "completed" }).then(() => alert("Match completed!"));
        }

        function deleteMatch(id) {
            if(confirm("Are you sure?")) {
                db.collection("matches").doc(id).delete().then(() => alert("Deleted!"));
            }
        }

        function markWithdrawalSuccess(id) {
            db.collection("withdrawals").doc(id).update({ status: "Success (Paid)" }).then(() => {
                alert("Marked as Successful!");
            });
        }

        function updateUserCoins(uid) {
            let inputVal = document.getElementById(`add-amt-${uid}`).value;
            let amountToAdd = Number(inputVal);
            if(!amountToAdd) {
                alert("Please enter a valid amount!");
                return;
            }

            db.collection("users").doc(uid).get().then(doc => {
                if(doc.exists) {
                    let currentWallet = doc.data().wallet || 0;
                    let newWallet = currentWallet + amountToAdd;
                    db.collection("users").doc(uid).update({ wallet: newWallet }).then(() => {
                        alert("Coins updated successfully!");
                        document.getElementById(`add-amt-${uid}`).value = "";
                    });
                }
            });
        }
    </script>
</body>
</html>
